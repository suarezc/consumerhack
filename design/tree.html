<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryTime Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed sky that is the whole page. Words sit top-left in the sky,
   the tree stands right of centre on a dark hill, and the controls rest on the hill.
   Single visual world on purpose: the time of day sets the colours, not the viewer's theme. */
:root {
  color-scheme: dark;
  --paper: #f6efe6;        /* light text, always used on the hill */
  --dusk: #0b1030;         /* page ground behind the canvas */
  --hill: #090c22;         /* matches the foreground hill at night */
  --lantern: #ffd27a;      /* your own blossom, and focus rings */
  --petal: #ffe9e0;        /* everyone else's blossom */
  --fg: #f6efe6;           /* sky text; script moves it between ink and paper through the day */
  --fg-soft: rgba(246, 239, 230, .72);
  --line: rgba(246, 239, 230, .34);
  --wash: rgba(246, 239, 230, .10);
  --font-voice: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-meta: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--dusk); color: var(--paper); font-family: var(--font-voice); }
.scene { position: relative; height: 100%; min-height: 540px; overflow: hidden; background: var(--dusk); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
#sky.readable { cursor: pointer; }

.top {
  position: absolute; inset: 0 0 auto 0;
  padding-block: clamp(20px, 4vh, 44px) 0;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
  color: var(--fg); pointer-events: none;
  max-width: 34rem;
}
.meta {
  font-family: var(--font-meta); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  margin: 0; display: flex; flex-wrap: wrap; gap: 0 .9em; font-variant-numeric: tabular-nums;
}
.meta .brand { font-weight: 500; }
.question {
  margin: 0; font-style: italic; font-weight: 300;
  font-size: clamp(1.55rem, 1.1rem + 2.1vw, 2.7rem); line-height: 1.14;
  text-wrap: balance; letter-spacing: -.01em;
}
.count { margin: 0; font-size: 1rem; opacity: .82; font-variant-numeric: tabular-nums; }

.card {
  position: absolute; left: 50%; bottom: calc(var(--controls-h, 120px) + 18px);
  transform: translateX(-50%);
  width: min(26rem, calc(100% - 40px));
  background: rgba(9, 12, 34, .86); border: 1px solid var(--line);
  padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.card.grow { animation: grow .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes grow { from { transform: translateX(-50%) translate(var(--dx, 0px), var(--dy, 0px)) scale(.05); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.grow { animation: none; } }
.card p { margin: 0; }
.card button { align-self: flex-start; }
.card .answer { font-size: 1.2rem; line-height: 1.38; font-style: italic; }
.card .who { font-family: var(--font-meta); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card .who .mine { color: var(--lantern); }

.controls {
  position: absolute; inset: auto 0 0 0;
  padding-block: 14px max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
}
.scrub { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.scrub .ticks { display: flex; justify-content: space-between; font-family: var(--font-meta); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-soft); }
input[type="range"] { width: 100%; margin: 0; height: 22px; background: transparent; -webkit-appearance: none; appearance: none; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--lantern); margin-top: -7px; border: 0; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--lantern); border: 0; }
button {
  font-family: var(--font-meta); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper); background: var(--wash); border: 1px solid var(--line);
  padding: 11px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
button:hover { background: rgba(246, 239, 230, .18); }
button.primary { color: var(--hill); background: var(--lantern); border-color: var(--lantern); }
button.primary:hover { background: #ffdf9c; }
button:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }
</style>
</head>
<body>
<main class="scene" id="scene">
  <canvas id="sky" role="img" aria-label="A tree on a hill that grows from a sapling in the morning to a blossoming tree at night, one blossom for each answer."></canvas>

  <header class="top">
    <p class="meta"><span class="brand">StoryTime</span><span id="clock">19:57</span><span id="phase">Night</span></p>
    <h1 class="question">What are you carrying today that you haven’t told anyone?</h1>
    <p class="count"><span id="n">0</span> <span id="nLabel">answers on the tree</span></p>
  </header>

  <aside class="card" id="card" hidden aria-live="polite">
    <p class="answer" id="cardText"></p>
    <p class="who"><span id="cardWho"></span><span>Sample answer</span></p>
    <button type="button" id="note">Send a note</button>
  </aside>

  <footer class="controls" id="controls">
    <button type="button" id="play">Play the day</button>
    <button type="button" id="sound" aria-pressed="false">Sound off</button>
    <label class="scrub" for="day">
      <input type="range" id="day" min="0" max="1000" value="930" aria-label="Time of day">
      <span class="ticks"><span>6:00</span><span>Midday</span><span>Bloom</span><span>21:00</span></span>
    </label>
    <button type="button" id="add" class="primary">Add my answer</button>
    <button type="button" id="read" class="primary" hidden>Read an answer</button>
  </footer>
</main>

<script>
(function () {
  'use strict';

  /* ---------- small helpers ---------- */
  function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (v) => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const KEYS = [0, 0.35, 0.68, 0.82, 1];
  function ramp(list) { const c = list.map(hex); return function (t) { let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1]) i++; const u = clamp((t - KEYS[i]) / (KEYS[i + 1] - KEYS[i]), 0, 1); const a = c[i], b = c[i + 1]; return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * u) + ',' + Math.round(a[1] + (b[1] - a[1]) * u) + ',' + Math.round(a[2] + (b[2] - a[2]) * u) + ')'; }; }

  /* ---------- palette through the day: dawn, midday, golden hour, dusk, night ---------- */
  const C = {
    skyTop:  ramp(['#c9cfe0', '#bfd9e6', '#e8c9a8', '#3a3566', '#0b1030']),
    skyBot:  ramp(['#f3d9cf', '#eaf1ea', '#f2a37c', '#b5668a', '#1d2452']),
    hillFar: ramp(['#a9b3c6', '#9fc0b8', '#c98f7f', '#5a4777', '#171c44']),
    hillMid: ramp(['#7f93a0', '#6fa08e', '#9a6a66', '#3e3560', '#111538']),
    ground:  ramp(['#33503f', '#375f45', '#3d4034', '#1c1936', '#090c22']),
    bark:    ramp(['#3b2f33', '#3a2c28', '#33221f', '#15112a', '#04050d']),
    leaf0:   ramp(['#7fa58a', '#6fa46f', '#8a9a55', '#2c4a5c', '#1c3646']),
    leaf1:   ramp(['#9dbf9a', '#8fbf7f', '#b0a85c', '#35586a', '#234453']),
    leaf2:   ramp(['#5f8a76', '#4f8a5c', '#6f7f48', '#233c50', '#152b3a']),
    ink:     ramp(['#2a2740', '#26323a', '#3a2420', '#f3e6dc', '#f6efe6'])
  };

  /* ---------- the tree: built once from a seed, then only drawn ---------- */
  function buildTree(seed) {
    const R = rng(seed);
    let maxDist = 0, count = 0;
    const buds = [];
    function mk(rel, len, w, depth, dist, abs) {
      let a = abs + rel;
      if (a > 1.35) { rel -= (a - 1.35); a = 1.35; }       // keep limbs from drooping below level
      if (a < -1.35) { rel += (-1.35 - a); a = -1.35; }
      const n = { rel: rel, len: len, w: w, depth: depth, dist: dist, curve: (R() - 0.5) * 0.9, ph: R() * 6.283, kids: [], leaves: [], buds: [] };
      count++;
      maxDist = Math.max(maxDist, dist + len);
      if (w > 1.0 && depth < 9) {
        n.kids.push(mk((R() - 0.5) * (depth < 2 ? 0.28 : 0.6), len * (0.8 + R() * 0.1), w * 0.78, depth + 1, dist + len, a));
        const sides = depth === 0 ? 1 : (R() < 0.7 ? 1 : 2);
        let sgn = R() < 0.5 ? -1 : 1;
        for (let i = 0; i < sides; i++) {
          n.kids.push(mk(sgn * (0.42 + R() * 0.5), len * (0.6 + R() * 0.2), w * (0.56 + R() * 0.1), depth + 1, dist + len, a));
          sgn = -sgn;
        }
      }
      n.kids.forEach(function (k) { k.parent = n; });
      const tip = n.kids.length === 0;
      if (depth >= 3) {
        const k = tip ? 5 : 2 + Math.floor(R() * 2);
        for (let i = 0; i < k; i++) {
          const t = tip ? 0.45 + R() * 0.55 : 0.2 + R() * 0.8;
          n.leaves.push({ t: t, a: (R() < 0.5 ? -1 : 1) * (0.45 + R() * 0.9), size: 0.05 + R() * 0.04, tone: Math.floor(R() * 3) });
        }
      }
      if (depth >= 4) {
        const k = tip ? 1 + Math.floor(R() * 2) : (R() < 0.45 ? 1 : 0);
        for (let i = 0; i < k; i++) {
          const b = { t: tip ? 0.7 + R() * 0.3 : 0.3 + R() * 0.7, off: (R() - 0.5) * 0.12, rot: R() * 6.283, size: 0.85 + R() * 0.45, delay: R() * 0.62, node: n, key: 0, order: 0, x: 0, y: 0, open: 0, shown: false };
          n.buds.push(b); buds.push(b);
        }
      }
      return n;
    }
    const root = mk(0, 1, 13, 0, 0, 0);
    // keep one bud site in three, so a full tree holds a few hundred blossoms
    buds.forEach(function (b, i) { b.keep = i % 3 === 0; });
    (function thin(n) { n.buds = n.buds.filter(function (b) { return b.keep; }); n.kids.forEach(thin); })(root);
    for (let i = buds.length - 1; i >= 0; i--) if (!buds[i].keep) buds.splice(i, 1);
    buds.forEach(function (b) { b.at = (b.node.dist + b.t * b.node.len) / maxDist; b.key = b.at + R() * 0.25; });
    // blossoms open in a wave that starts at the trunk and travels out to the tips
    let lo = 1, hi = 0;
    buds.forEach(function (b) { lo = Math.min(lo, b.at); hi = Math.max(hi, b.at); });
    buds.forEach(function (b) { b.delay = 0.54 * (b.at - lo) / Math.max(0.001, hi - lo) + R() * 0.07; });
    buds.sort(function (p, q) { return p.key - q.key; });
    buds.forEach(function (b, i) { b.order = i; });
    // unit-space bounds so the tree can be fitted to any screen
    let minX = 0, maxX = 0, top = 0;
    (function walk(n, x, y, ang) { const a = ang + n.rel, ex = x + Math.sin(a) * n.len, ey = y - Math.cos(a) * n.len; minX = Math.min(minX, ex); maxX = Math.max(maxX, ex); top = Math.min(top, ey); n.kids.forEach(function (k) { walk(k, ex, ey, a); }); })(root, 0, 0, 0);
    return { root: root, buds: buds, maxDist: maxDist, count: count, minX: minX, maxX: maxX, height: -top };
  }
  /*TREE-END*/

  const tree = buildTree(11);
  const CAP = tree.buds.length;

  const SAMPLES = [
    ['My dog is old now and I keep checking that he is still breathing.', 'Tashkent'],
    ['I check on my dog three times a night. I have not told my wife why.', 'San Francisco'],
    ['I said I was fine with the move. I am not fine with the move.', 'Lisbon'],
    ['The business is two months from empty and everyone thinks it is going well.', 'Lagos'],
    ['I miss my brother and I do not know how to call him after this long.', 'Osaka'],
    ['I am proud of myself today and it felt strange to say it out loud.', 'Montreal'],
    ['My mother forgot my name on the phone. Only for a second.', 'Kraków'],
    ['I think I chose the safe life and I am only now noticing.', 'Auckland'],
    ['The test came back clear. I have been holding my breath for six weeks.', 'Bogotá'],
    ['I am the one everybody leans on and I am tired.', 'Nairobi'],
    ['I still set two cups out in the morning.', 'Bergen'],
    ['I want to quit and start over at forty and it scares me how much.', 'Pune']
  ];

  /* ---------- canvas setup ---------- */
  const scene = document.getElementById('scene');
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, U = 1, baseX = 0, groundY = 0, dpr = 1;

  function sprite(size, paint) { const c = document.createElement('canvas'); c.width = c.height = size; paint(c.getContext('2d'), size); return c; }
  const glow = sprite(128, function (g, s) { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,214,150,.55)'); r.addColorStop(0.35, 'rgba(255,190,120,.18)'); r.addColorStop(1, 'rgba(255,170,110,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });
  function flower(petal, heart) { return sprite(72, function (g, s) { g.translate(s / 2, s / 2); g.fillStyle = petal; for (let i = 0; i < 5; i++) { g.rotate(6.283 / 5); g.beginPath(); g.ellipse(0, -s * 0.24, s * 0.13, s * 0.22, 0, 0, 6.283); g.fill(); } g.fillStyle = heart; g.beginPath(); g.arc(0, 0, s * 0.085, 0, 6.283); g.fill(); }); }
  const bloomOther = flower('#ffe9e0', '#ffb976');
  const bloomMine = flower('#ffd27a', '#fff6dc');

  const starR = rng(5), stars = [];
  for (let i = 0; i < 150; i++) stars.push({ x: starR(), y: starR() * 0.72, r: 0.4 + starR() * 1.1, ph: starR() * 6.283 });
  const flyR = rng(9), flies = [];
  for (let i = 0; i < 26; i++) flies.push({ x: flyR(), y: flyR(), ph: flyR() * 6.283, sp: 0.25 + flyR() * 0.5 });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = scene.clientWidth; H = scene.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const controlsH = document.getElementById('controls').offsetHeight;
    scene.style.setProperty('--controls-h', controlsH + 'px');
    const narrow = W < 720;
    groundY = H - Math.max(controlsH + 46, H * 0.2);
    const topPad = narrow ? document.querySelector('.top').offsetHeight + 26 : 70;
    const availH = Math.max(160, groundY - topPad);
    const availW = W * (narrow ? 0.94 : 0.6);
    U = Math.min(availH / tree.height, availW / (tree.maxX - tree.minX));
    const mid = narrow ? 0.5 : 0.62;
    baseX = W * mid - ((tree.maxX + tree.minX) / 2) * U;
    render();
  }

  /* ---------- state ---------- */
  let t = 0.93;              // 0 = 6:00, 1 = 21:00
  let extra = 0;             // answers the viewer added
  const mine = {};           // bud order -> true
  const pulses = [];         // rings where an answer just landed
  const pending = {};        // bud order -> true while its light is still climbing the tree
  const motes = [];          // lights carrying a new answer up to its bud
  const threads = [];        // strands of fairy lights: one strand per conversation, one light per note
  let seeded = false;
  let lastB = 1;             // last bloom value, to catch the moment the bloom starts
  let px = 0, py = 0, tpx = 0, tpy = 0;   // depth: where the pointer is (-1..1), eased; nearer layers shift more
  let selected = -1;
  let playing = false, lastTs = 0, clockT = 0;

  const growth = (v) => 0.07 + 0.93 * smooth(v / 0.78);
  const bloomAt = (v) => smooth((v - 0.79) / 0.16);
  const nightAt = (v) => smooth((v - 0.72) / 0.18);
  const answersAt = (v) => Math.min(CAP, Math.round((CAP - 14) * smooth(v / 0.8)) + extra);

  /* ---------- drawing ---------- */
  const leafBuf = [[], [], []];

  function hill(yBase, amp, freq, shift, fill) {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = -64; x <= W + 64; x += 8) ctx.lineTo(x, yBase + Math.sin(x * freq + shift) * amp + Math.sin(x * freq * 2.3 + shift * 1.7) * amp * 0.35);
    ctx.lineTo(W + 64, H + 64); ctx.lineTo(-64, H + 64); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  const groundAt = (x) => groundY + Math.pow((x - baseX) / W, 2) * H * 0.16;

  function drawBranch(n, x, y, ang, g, gDist) {
    const f = clamp((gDist - n.dist) / n.len, 0, 1);
    n.f = f;
    if (f <= 0) return;
    const a = ang + n.rel + (still ? 0 : Math.sin(clockT * 0.9 + n.ph) * 0.005 * Math.min(n.depth, 6));
    const L = n.len * U * f;
    const ex = x + Math.sin(a) * L, ey = y - Math.cos(a) * L;
    const cx = (x + ex) / 2 + Math.cos(a) * n.curve * L * 0.22, cy = (y + ey) / 2 + Math.sin(a) * n.curve * L * 0.22;
    n.x0 = x; n.y0 = y; n.cx = cx; n.cy = cy; n.ex = ex; n.ey = ey;
    ctx.lineWidth = Math.max(0.7, n.w * U * 0.0105 * (0.3 + 0.7 * g));
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();

    for (let i = 0; i < n.leaves.length; i++) {
      const lf = n.leaves[i]; if (lf.t > f) continue;
      const sc = clamp((gDist - (n.dist + lf.t * n.len)) / 0.35, 0, 1); if (sc <= 0) continue;
      const u = lf.t / f, v = 1 - u;
      const px = v * v * x + 2 * v * u * cx + u * u * ex, py = v * v * y + 2 * v * u * cy + u * u * ey;
      const s = lf.size * U * sc, rot = a + lf.a - 1.5708;
      leafBuf[lf.tone].push(px + Math.cos(rot) * s * 0.9, py + Math.sin(rot) * s * 0.9, s, rot);
    }
    for (let i = 0; i < n.buds.length; i++) {
      const b = n.buds[i]; b.shown = false; if (b.t > f) continue;
      const u = b.t / f, v = 1 - u;
      b.x = v * v * x + 2 * v * u * cx + u * u * ex + Math.cos(a) * b.off * U;
      b.y = v * v * y + 2 * v * u * cy + u * u * ey + Math.sin(a) * b.off * U;
      b.shown = true;
    }
    if (n.depth === 0 && g < 0.3) {            // the sapling's first two leaves
      const al = clamp((0.3 - g) / 0.1, 0, 1), s = U * 0.11;
      ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = C.leaf1(t);
      for (let k = -1; k <= 1; k += 2) { const rot = a + k * 0.95 - 1.5708; ctx.beginPath(); ctx.ellipse(ex + Math.cos(rot) * s, ey + Math.sin(rot) * s, s, s * 0.42, rot, 0, 6.283); ctx.fill(); }
      ctx.restore();
    }
    for (let i = 0; i < n.kids.length; i++) drawBranch(n.kids[i], ex, ey, a, g, gDist);
  }

  function render() {
    if (!W) return;
    const g = growth(t), b = bloomAt(t), nf = nightAt(t), n = answersAt(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const sky = ctx.createLinearGradient(0, 0, 0, groundY + 40);
    sky.addColorStop(0, C.skyTop(t)); sky.addColorStop(1, C.skyBot(t));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    if (nf > 0.01) {
      ctx.save(); ctx.translate(-px * 5, -py * 3);
      ctx.fillStyle = '#fdf3e4';
      for (let i = 0; i < stars.length; i++) { const s = stars[i]; ctx.globalAlpha = nf * (0.35 + 0.5 * (still ? 0.6 : (0.5 + 0.5 * Math.sin(clockT * 1.3 + s.ph)))); ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill(); }
      const mx = W * 0.86, my = H * (W < 720 ? 0.36 : 0.2), mr = Math.max(14, Math.min(W, H) * 0.038);
      ctx.globalAlpha = nf * 0.5; ctx.drawImage(glow, mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
      ctx.globalAlpha = nf; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fill(); ctx.restore();
      ctx.globalAlpha = 1;
    }
    // low sun warmth near the horizon at golden hour
    const warm = smooth((t - 0.5) / 0.18) * (1 - smooth((t - 0.74) / 0.12));
    if (warm > 0.01) { const sx = W * 0.2, sy = groundY - H * 0.04, sr = Math.max(W, H) * 0.5; const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr); sg.addColorStop(0, 'rgba(255,214,150,' + (0.75 * warm) + ')'); sg.addColorStop(0.25, 'rgba(255,170,110,' + (0.3 * warm) + ')'); sg.addColorStop(1, 'rgba(255,150,110,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H); }

    ctx.save(); ctx.translate(-px * 10, -py * 4); hill(groundY - H * 0.075, H * 0.022, 0.0042, 1.2, C.hillFar(t)); ctx.restore();
    ctx.save(); ctx.translate(-px * 18, -py * 6); hill(groundY - H * 0.03, H * 0.016, 0.0061, 4.1, C.hillMid(t)); ctx.restore();

    // the tree and its hill are the nearest solid layer
    ctx.save(); ctx.translate(-px * 30, -py * 9);
    // warm halo behind the crown once the blossoms are lit
    if (b > 0.01) { const hx = baseX + ((tree.maxX + tree.minX) / 2) * U, hy = groundY - tree.height * U * 0.62, hr = tree.height * U * 0.85; ctx.globalAlpha = 0.5 * b; ctx.drawImage(glow, hx - hr, hy - hr, hr * 2, hr * 2); ctx.globalAlpha = 1; }

    // foreground hill
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = -64; x <= W + 64; x += 8) ctx.lineTo(x, groundAt(x));
    ctx.lineTo(W + 64, H + 64); ctx.lineTo(-64, H + 64); ctx.closePath(); ctx.fillStyle = C.ground(t); ctx.fill();

    // tree
    leafBuf[0].length = leafBuf[1].length = leafBuf[2].length = 0;
    ctx.strokeStyle = C.bark(t); ctx.lineCap = 'round';
    drawBranch(tree.root, baseX, groundY + 3, 0, g, g * tree.maxDist * 1.02);
    const tones = [C.leaf0(t), C.leaf1(t), C.leaf2(t)];
    for (let k = 0; k < 3; k++) { const L = leafBuf[k]; ctx.fillStyle = tones[k]; ctx.beginPath(); for (let i = 0; i < L.length; i += 4) { ctx.moveTo(L[i] + Math.cos(L[i + 3]) * L[i + 2], L[i + 1] + Math.sin(L[i + 3]) * L[i + 2]); ctx.ellipse(L[i], L[i + 1], L[i + 2], L[i + 2] * 0.44, L[i + 3], 0, 6.283); } ctx.fill(); }

    // grass at the foot of the trunk
    ctx.strokeStyle = C.ground(t); ctx.lineWidth = 1.6;
    ctx.beginPath(); for (let i = -9; i <= 9; i++) { const gx = baseX + i * U * 0.035, gy = groundAt(gx) + 2; ctx.moveTo(gx, gy); ctx.quadraticCurveTo(gx + i * 0.6, gy - U * 0.07, gx + i * 1.4, gy - U * (0.09 + (i * i % 5) * 0.012)); } ctx.stroke();

    // buds and blossoms: one per answer
    const budR = Math.max(1.4, U * 0.014), flowerR = Math.max(5, U * 0.062);
    const buds = tree.buds;
    if (b > 0.01) { ctx.globalCompositeOperation = 'lighter'; for (let i = 0; i < n && i < buds.length; i++) { const d = buds[i]; if (!d.shown) continue; const o = smooth((b - d.delay) / 0.38); if (o <= 0 || pending[i]) continue; const r = flowerR * d.size * (mine[i] ? 4.6 : 3.2); ctx.globalAlpha = o * (0.35 + 0.55 * nf); ctx.drawImage(glow, d.x - r, d.y - r, r * 2, r * 2); } ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
    for (let i = 0; i < n && i < buds.length; i++) {
      const d = buds[i]; if (!d.shown) continue;
      const o = smooth((b - d.delay) / 0.38); d.open = o; if (pending[i]) continue;
      if (o < 1) { ctx.globalAlpha = 1 - o; ctx.fillStyle = mine[i] ? '#ffd27a' : '#f4c9c0'; ctx.beginPath(); ctx.arc(d.x, d.y, budR * (mine[i] ? 1.7 : 1), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
      if (o > 0) { const r = flowerR * d.size * (mine[i] ? 1.35 : 1) * (0.3 + 0.7 * o); ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot + (1 - o) * 1.2); ctx.globalAlpha = Math.min(1, o * 1.4); ctx.drawImage(mine[i] ? bloomMine : bloomOther, -r, -r, r * 2, r * 2); ctx.restore(); }
    }
    ctx.globalAlpha = 1;
    // threads: a strand of fairy lights strung between the two people's blossoms
    if (b > 0.75) {
      if (!seeded && b > 0.9) seedThreads(n);
      const ta = smooth((b - 0.75) / 0.25), lr = Math.max(5, U * 0.036);
      for (let k = 0; k < threads.length; k++) {
        const th = threads[k], A = buds[th.a], B = buds[th.b];
        if (th.a >= n || th.b >= n || !A.shown || !B.shown) continue;
        const al = ta * Math.min(A.open, B.open); if (al < 0.03) continue;
        const dist = Math.hypot(B.x - A.x, B.y - A.y), qx = (A.x + B.x) / 2, qy = (A.y + B.y) / 2 + dist * 0.34;
        ctx.globalAlpha = al * 0.4; ctx.strokeStyle = '#ffe2b0'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(qx, qy, B.x, B.y); ctx.stroke();
        for (let j = 0; j < th.count; j++) {
          const u = (j + 1) / (th.count + 1), v = 1 - u;
          const lx = v * v * A.x + 2 * v * u * qx + u * u * B.x, ly = v * v * A.y + 2 * v * u * qy + u * u * B.y;
          const tw = still ? 0.85 : 0.65 + 0.35 * Math.sin(clockT * 2.1 + th.ph + j * 1.9);
          ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = al * tw; ctx.drawImage(glow, lx - lr * 2.4, ly - lr * 2.4, lr * 4.8, lr * 4.8); ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = al; ctx.fillStyle = th.own ? '#ffd27a' : '#fff1d6'; ctx.beginPath(); ctx.arc(lx, ly, th.own ? 2.2 : 1.6, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
    if (selected >= 0 && buds[selected] && buds[selected].shown && selected < n) { const d = buds[selected]; ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(d.x, d.y, flowerR * 1.9, 0, 6.283); ctx.stroke(); }
    for (let i = pulses.length - 1; i >= 0; i--) { const p = pulses[i], d = buds[p.i], age = (clockT - p.t0) / 1.6; if (age >= 1 || !d) { pulses.splice(i, 1); continue; } if (!d.shown) continue; ctx.strokeStyle = 'rgba(255,210,122,' + (1 - age) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(d.x, d.y, budR * 2 + age * U * 0.22, 0, 6.283); ctx.stroke(); }

    // a new answer: a light leaves the button, reaches the foot of the trunk and climbs to its bud
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i], p = motePos(m);
      m.trail.push(p.x, p.y); if (m.trail.length > 36) m.trail.splice(0, 2);
      ctx.fillStyle = '#ffd27a';
      for (let k = 0; k < m.trail.length; k += 2) { ctx.globalAlpha = 0.5 * (k / m.trail.length); ctx.beginPath(); ctx.arc(m.trail[k], m.trail[k + 1], 1 + 1.6 * (k / m.trail.length), 0, 6.283); ctx.fill(); }
      const mr = Math.max(16, U * 0.16);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.9; ctx.drawImage(glow, p.x - mr, p.y - mr, mr * 2, mr * 2); ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 6.283); ctx.fill();
      if (p.done) { motes.splice(i, 1); delete pending[m.i]; pulses.push({ i: m.i, t0: clockT }); tone(880, 1.4, 0.07); tone(1318.5, 1.8, 0.035); }
    }
    ctx.globalAlpha = 1;

    ctx.restore();
    if (nf > 0.2 && !still) { ctx.save(); ctx.translate(-px * 46, -py * 14); ctx.fillStyle = '#ffe6a8'; for (let i = 0; i < flies.length; i++) { const f = flies[i]; const fx = (f.x + Math.sin(clockT * 0.11 * f.sp + f.ph) * 0.05) * W, fy = groundY - f.y * H * 0.42 + Math.sin(clockT * 0.5 * f.sp + f.ph * 2) * 14; ctx.globalAlpha = nf * (0.25 + 0.55 * Math.max(0, Math.sin(clockT * 1.1 * f.sp + f.ph))); ctx.beginPath(); ctx.arc(fx, fy, 1.4, 0, 6.283); ctx.fill(); } ctx.restore(); ctx.globalAlpha = 1; }
  }

  function seedThreads(n) {            // a few sample conversations, picked once the blossoms have positions
    seeded = true; const R = rng(23), buds = tree.buds; let tries = 0;
    while (threads.length < 16 && tries++ < 400) {
      const a = Math.floor(R() * n), A = buds[a]; if (!A || !A.shown) continue;
      const want = U * (0.5 + R() * 0.9); let best = -1, bd = 1e9;
      for (let j = 0; j < n; j++) { if (j === a) continue; const B = buds[j]; if (!B.shown) continue; const e = Math.abs(Math.hypot(B.x - A.x, B.y - A.y) - want); if (e < bd) { bd = e; best = j; } }
      if (best >= 0) threads.push({ a: a, b: best, count: 2 + Math.floor(R() * 5), ph: R() * 6.283, own: false });
    }
  }

  function motePos(m) {
    const age = clockT - m.t0, FLY = 0.6, CLIMB = 1.8;
    const footX = baseX, footY = groundY + 3;
    if (age < FLY) { const u = smooth(age / FLY), v = 1 - u, mx = (m.fx + footX) / 2, my = Math.min(m.fy, footY) - 60; return { x: v * v * m.fx + 2 * v * u * mx + u * u * footX, y: v * v * m.fy + 2 * v * u * my + u * u * footY, done: false }; }
    const d = tree.buds[m.i], chain = [], segs = [];
    for (let n = d.node; n; n = n.parent) chain.unshift(n);
    let total = 0;
    for (let k = 0; k < chain.length; k++) { const n = chain[k]; if (!(n.f > 0)) break; const uMax = n === d.node ? Math.min(1, d.t / n.f) : 1; const L = n.len * U * n.f * uMax; segs.push([n, uMax, L]); total += L; if (n.f < 1) break; }
    const done = age >= FLY + CLIMB;
    if (!segs.length) return { x: footX, y: footY, done: done };
    let dist = smooth((age - FLY) / CLIMB) * total;
    for (let k = 0; k < segs.length; k++) {
      const s = segs[k];
      if (dist <= s[2] || k === segs.length - 1) { const u = clamp(s[2] > 0 ? dist / s[2] : 1, 0, 1) * s[1], v = 1 - u, n = s[0]; return { x: v * v * n.x0 + 2 * v * u * n.cx + u * u * n.ex, y: v * v * n.y0 + 2 * v * u * n.cy + u * u * n.ey, done: done }; }
      dist -= s[2];
    }
    return { x: footX, y: footY, done: done };
  }

  /* ---------- sound: off until the viewer turns it on ---------- */
  let audio = null, soundOn = false;
  function tone(freq, dur, vol, delay) {
    if (!soundOn || !audio) return;
    try { const t0 = audio.currentTime + (delay || 0), o = audio.createOscillator(), gn = audio.createGain(); o.type = 'sine'; o.frequency.value = freq; gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.04); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(gn); gn.connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.05); } catch (e) {}
  }
  function chord() { [261.63, 329.63, 392.0, 523.25, 659.25].forEach(function (f, k) { tone(f, 4.5, 0.05, k * 0.22); }); }
  document.getElementById('sound').addEventListener('click', function () {
    soundOn = !soundOn;
    if (soundOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
    if (soundOn && audio && audio.state === 'suspended') audio.resume();
    this.textContent = soundOn ? 'Sound on' : 'Sound off'; this.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) tone(880, 1.2, 0.06);
  });

  /* ---------- words and controls ---------- */
  const $ = (id) => document.getElementById(id);
  const day = $('day'), playBtn = $('play'), addBtn = $('add'), readBtn = $('read'), card = $('card');
  function phaseName(v) { return v < 0.12 ? 'Morning: the question arrives' : v < 0.5 ? 'Midday: answers gather' : v < 0.8 ? 'Afternoon: the tree fills out' : v < 0.9 ? 'Evening: the tree blooms' : 'Night: read the answers'; }
  function syncWords() {
    const mins = Math.round(360 + t * 900), hh = Math.floor(mins / 60), mm = mins % 60;
    $('clock').textContent = hh + ':' + (mm < 10 ? '0' : '') + mm;
    $('phase').textContent = phaseName(t);
    const bNow = bloomAt(t); if (bNow > 0.04 && lastB <= 0.04) chord(); lastB = bNow;
    const n = answersAt(t);
    $('n').textContent = n;
    $('nLabel').textContent = bloomAt(t) > 0.5 ? (n === 1 ? 'blossom open' : 'blossoms open') : (n === 1 ? 'answer on the tree' : 'answers on the tree');
    scene.style.setProperty('--fg', C.ink(t));
    const late = bloomAt(t) > 0.85;
    if (addBtn.hidden !== late) { addBtn.hidden = late; readBtn.hidden = !late; resize(); }
    cv.classList.toggle('readable', late);
    if (!late && !card.hidden) { card.hidden = true; selected = -1; }
  }
  function setT(v, fromSlider) { t = clamp(v, 0, 1); if (!fromSlider) day.value = Math.round(t * 1000); syncWords(); if (still || !running) render(); }

  function showAnswer(i) {
    selected = i; const s = SAMPLES[i % SAMPLES.length];
    $('cardText').textContent = mine[i] ? 'Your answer sits here, open with everyone else’s.' : '“' + s[0] + '”';
    $('cardWho').textContent = mine[i] ? 'Yours' : s[1];
    $('cardWho').className = mine[i] ? 'mine' : '';
    $('note').hidden = !!mine[i];
    card.hidden = false;
    const d = tree.buds[i];   // the card grows out of the blossom that was tapped
    card.classList.remove('grow'); void card.offsetWidth;
    card.style.setProperty('--dx', (d.x - px * 30 - card.offsetLeft) + 'px');
    card.style.setProperty('--dy', (d.y - py * 9 - card.offsetTop - card.offsetHeight / 2) + 'px');
    card.classList.add('grow');
    if (still || !running) render();
  }
  cv.addEventListener('click', function (e) {
    if (bloomAt(t) <= 0.85) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left + px * 30, y = e.clientY - r.top + py * 9, n = answersAt(t);
    let best = -1, bd = 26 * 26;
    for (let i = 0; i < n && i < tree.buds.length; i++) { const d = tree.buds[i]; if (!d.shown || d.open < 0.5) continue; const q = (d.x - x) * (d.x - x) + (d.y - y) * (d.y - y); if (q < bd) { bd = q; best = i; } }
    if (best >= 0) showAnswer(best); else { card.hidden = true; selected = -1; if (still || !running) render(); }
  });
  readBtn.addEventListener('click', function () { const n = answersAt(t); let i = Math.floor(Math.random() * n), tries = 0; while (tries++ < 40 && (!tree.buds[i].shown || i === selected)) i = Math.floor(Math.random() * n); showAnswer(i); });
  addBtn.addEventListener('click', function () { const i = answersAt(t); if (i >= CAP) return; mine[i] = true; extra++;
    if (still) { pulses.push({ i: i, t0: clockT }); syncWords(); render(); return; }
    const br = addBtn.getBoundingClientRect(), cr = cv.getBoundingClientRect();
    pending[i] = true; motes.push({ i: i, t0: clockT, fx: br.left + br.width / 2 - cr.left + px * 30, fy: br.top - cr.top + py * 9, trail: [] });
    syncWords(); });
  day.addEventListener('input', function () { stop(); setT(day.value / 1000, true); });
  $('note').addEventListener('click', function () {   // each note adds one light to the strand between your blossom and theirs
    if (selected < 0) return;
    const n = answersAt(t), S = tree.buds[selected]; let me = -1;
    for (const key in mine) { const i = +key; if (i < n && i !== selected && tree.buds[i].shown) { me = i; break; } }
    if (me < 0) { let bd = 1e9; for (let j = 0; j < n; j++) { if (j === selected) continue; const B = tree.buds[j]; if (!B.shown) continue; const d = Math.hypot(B.x - S.x, B.y - S.y); if (d > U * 0.5 && d < bd) { bd = d; me = j; } } if (me < 0) return; mine[me] = true; }
    let th = null;
    for (let k = 0; k < threads.length; k++) { const x = threads[k]; if ((x.a === me && x.b === selected) || (x.a === selected && x.b === me)) th = x; }
    if (!th) { th = { a: me, b: selected, count: 0, ph: Math.random() * 6.283, own: true }; threads.push(th); }
    th.own = true; if (th.count < 9) th.count++;
    tone(1046.5, 1.2, 0.05);
    if (still || !running) render();
  });
  function stop() { playing = false; playBtn.textContent = 'Play the day'; }
  scene.addEventListener('pointermove', function (e) { if (still) return; const r = scene.getBoundingClientRect(); tpx = clamp(((e.clientX - r.left) / r.width - 0.5) * 2, -1, 1); tpy = clamp(((e.clientY - r.top) / r.height - 0.5) * 2, -1, 1); });
  scene.addEventListener('pointerleave', function () { tpx = 0; tpy = 0; });
  playBtn.addEventListener('click', function () { if (playing) { stop(); return; } if (t > 0.985) { t = 0; card.hidden = true; selected = -1; } playing = true; playBtn.textContent = 'Pause'; });

  /* ---------- loop ---------- */
  const running = !still;
  function frame(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts; clockT += dt;
    px += (tpx - px) * Math.min(1, dt * 4); py += (tpy - py) * Math.min(1, dt * 4);
    if (playing) { const nt = t + (dt / 24) * (t > 0.78 && t < 0.96 ? 0.45 : 1); if (nt >= 1) { setT(1); stop(); } else setT(nt); }
    render();
    requestAnimationFrame(frame);
  }
  if (still) { setInterval(function () { if (playing) { clockT += 0.25; const nt = t + 0.25 / 24; if (nt >= 1) { setT(1); stop(); } else setT(nt); } else if (pulses.length) { clockT += 0.25; render(); } }, 250); }

  window.addEventListener('resize', resize);
  syncWords(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  if (running) requestAnimationFrame(frame);
})();
</script>
</body>
